# Kotlin 编译改为**在 Gradle 进程内执行**。
#
# 本机实测（Windows / Gradle 8.12 / Kotlin 2.0.21）：默认的「另起编译进程」策略会**挂起** ——
# 终端与 daemon 日志都停在
#     [KOTLIN] Kotlin compilation 'jdkHome' argument: null
# 之后再无任何输出，CPU 占用长期 3%，且 ~/.kotlin/daemon 目录从未被创建（说明编译进程
# 压根没起来）。表现为 assembleDebug 卡死十几分钟到几十分钟不等。in-process 可绕过这一步。
kotlin.compiler.execution.strategy=in-process

# 堆调大一些：全量重编 83 个 Kotlin 文件 + Compose 编译器插件比增量编译吃内存得多。
# 注意本机可用内存不多（实测总 31.8 GB、可用仅 4.2 GB），所以不要盲目开到 6 GB 以上。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
